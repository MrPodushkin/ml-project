name: Lab 3 secure ML pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code data model and container gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.14.4
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.4"
      - name: Install pinned runtime and checking tools
        run: |
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Obtain verified data and reproduce Lab 2 artifact
        run: |
          python -m ci.prepare
          python -m ci.metadata
      - name: Ruff lint gate
        run: ruff check src/ tests/ ci/ | tee ci-artifacts/ruff.txt
      - name: Bandit static security gate
        run: python -m bandit -r src/ -f json -o ci-artifacts/bandit.json
      - name: Real unit and integration tests
        run: python -m pytest tests/ -q --junitxml=ci-artifacts/pytest.xml | tee ci-artifacts/pytest.txt
      - name: Dependency audit gate reject every known vulnerability
        run: python -m pip_audit -r requirements-runtime.txt --no-deps --disable-pip --format json --output ci-artifacts/pip-audit.json
      - name: Security policy demonstration simulated report only
        run: python -m ci.security_gate --demo --output ci-artifacts/security-demonstration.json
      - name: Data quality gate
        run: |
          python -m ci.demonstrate
          python -m ci.data_gate
      - name: Evaluate persisted candidate
        run: python -m ci.evaluate
      - name: Model quality gate maximum relative degradation 5 percent
        run: python -m ci.model_gate
      - name: Install pinned official scanner with checksum verification
        run: |
          python -m ci.install_trivy
          "$HOME/.local/bin/trivy" --version > ci-artifacts/trivy-version.txt
      - name: Build non-root runtime image
        run: docker build --pull -t ml-project:lab3 .
      - name: Dockerfile configuration gate
        run: '"$HOME/.local/bin/trivy" config --severity HIGH,CRITICAL,UNKNOWN --exit-code 1 --format json --output ci-artifacts/trivy-config.json Dockerfile'
      - name: Scan actual built image
        run: |
          docker save ml-project:lab3 > ci-artifacts/image.tar
          "$HOME/.local/bin/trivy" image --input ci-artifacts/image.tar --scanners vuln --format json --output ci-artifacts/trivy-image.json
      - name: Image security gate reject critical and unknown severity
        run: python -m ci.security_gate
      - name: Verify non-root and smoke predictions
        run: |
          docker run --rm --entrypoint id ml-project:lab3 -u | tee ci-artifacts/container-uid.txt
          test "$(cat ci-artifacts/container-uid.txt)" != 0
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 512m ml-project:lab3 --smoke | tee ci-artifacts/container-smoke.json
      - name: Preserve diagnostics even when an earlier gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab3-reports-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci-artifacts/ruff.txt
            ci-artifacts/bandit.json
            ci-artifacts/pytest.xml
            ci-artifacts/pytest.txt
            ci-artifacts/pip-audit.json
            ci-artifacts/provenance.json
            ci-artifacts/run-metadata.json
            ci-artifacts/data-gate.json
            ci-artifacts/candidate-metrics.json
            ci-artifacts/model-gate.json
            ci-artifacts/security-demonstration.json
            ci-artifacts/security-gate.json
            ci-artifacts/trivy-version.txt
            ci-artifacts/trivy-config.json
            ci-artifacts/trivy-image.json
            ci-artifacts/container-uid.txt
            ci-artifacts/container-smoke.json
